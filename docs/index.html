<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tutorial para Windows do Proxyum SpotX Old Theme.">
  <meta name="theme-color" content="#0b0d0c">
  <title>Tutorial para Windows | Proxyum SpotX</title>
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="brand">
      <img
        class="brand-logo"
        src="https://raw.githubusercontent.com/Sanderapps/proxyum-spotx-old-theme/main/assets/LOGO%20INSTALLER.png"
        alt="Logo do Proxyum SpotX"
        width="72"
        height="72"
      >
      <div>
        <p class="brand-name"><span>PROXYUM</span> SPOTX</p>
        <p class="brand-subtitle">OLD THEME INSTALLER</p>
      </div>
    </header>

    <section class="tutorial-card" aria-labelledby="tutorial-title">
      <p class="eyebrow">TUTORIAL PARA WINDOWS</p>
      <h1 id="tutorial-title">Assista antes de instalar</h1>
      <p class="intro">Dê play e acompanhe o passo a passo no seu computador.</p>

      <div class="video-frame">
        <iframe
          src="https://www.youtube-nocookie.com/embed/3fGM7dQDf8k?rel=0"
          title="Tutorial do Proxyum SpotX para Windows"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>

      <div class="actions">
        <a class="button button-primary" href="https://www.youtube.com/watch?v=3fGM7dQDf8k">Abrir no YouTube</a>
        <a class="button button-secondary" href="https://github.com/Sanderapps/proxyum-spotx-old-theme">Voltar ao repositório</a>
      </div>
    </section>

    <footer>Feito e mantido por <strong>Proxyum</strong>.</footer>
