name: VirusTotal security report

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release a analisar; vazio usa a mais recente
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: virustotal-report
  cancel-in-progress: false

jobs:
  scan:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check VirusTotal secret
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VIRUSTOTAL_API_KEY)) {
            throw 'Configure o segredo VIRUSTOTAL_API_KEY antes de executar este workflow.'
          }

      - name: Resolve release
        id: release
        shell: pwsh
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:INPUT_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:EVENT_TAG
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'Nao foi possivel determinar a release.'
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download exact release installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path release-scan -Force | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo "${{ github.repository }}" `
            --pattern 'ProxyumSpotX-Setup.exe' `
            --dir release-scan

      - name: Scan with VirusTotal
        id: virustotal
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPORT_PATH: ${{ runner.temp }}\VirusTotal-ProxyumSpotX-Setup.json
        run: |
          .\scripts\Scan-VirusTotal.ps1 `
            -FilePath .\release-scan\ProxyumSpotX-Setup.exe `
            -ApiKey $env:VIRUSTOTAL_API_KEY `
            -ReleaseTag $env:RELEASE_TAG `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -ReportPath $env:REPORT_PATH

      - name: Update README
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: update VirusTotal report for $env:RELEASE_TAG"
            git push origin HEAD:main
          }

      - name: Attach report to release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPORT_PATH: ${{ runner.temp }}\VirusTotal-ProxyumSpotX-Setup.json
        run: |
          gh release upload $env:RELEASE_TAG $env:REPORT_PATH `
            --repo "${{ github.repository }}" `
            --clobber

      - name: Summary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPORT_URL: ${{ steps.virustotal.outputs.report_url }}
          FLAGGED: ${{ steps.virustotal.outputs.flagged }}
          TOTAL: ${{ steps.virustotal.outputs.total }}
        run: |
          @(
            "## VirusTotal - $env:RELEASE_TAG",
            '',
            "Resultado: $env:FLAGGED de $env:TOTAL mecanismos marcaram o arquivo.",
            '',
            "[Abrir relatorio]($env:REPORT_URL)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
