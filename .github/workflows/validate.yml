name: Validate installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse and validate installer
        shell: powershell
        run: .\tests\Test-Installer.ps1

      - name: Build executable
        shell: powershell
        run: .\build\Build-Exe.ps1

      - name: Build graphical installer
        shell: powershell
        run: .\build\Build-Gui.ps1
